name: Build Moto G84 5G APK (InstaPin)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Deterministic Debug Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -f "app/keystore/instapin-debug.keystore" ]; then
            cp app/keystore/instapin-debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Assemble Moto G84 5G APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk InstaPin-MotoG84.apk

      - name: Generate Release Changelog Notes
        run: |
          echo "### What's New in v1.0.${{ github.run_number }}" > RELEASE_CHANGELOG.md
          git log -n 4 --pretty=format:"• %s" >> RELEASE_CHANGELOG.md
          echo "" >> RELEASE_CHANGELOG.md

      - name: Upload InstaPin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPin-MotoG84-debug-apk
          path: InstaPin-MotoG84.apk

      - name: Publish Latest APK & Changelog to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: InstaPin v1.0.${{ github.run_number }} (Moto G84 5G)
          body_path: RELEASE_CHANGELOG.md
          files: InstaPin-MotoG84.apk
          prerelease: false

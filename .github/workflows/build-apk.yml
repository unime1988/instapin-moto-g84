name: Build Moto G84 5G APK (InstaPin)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Assemble Moto G84 5G Debug APK
        run: gradle assembleDebug

      - name: Upload InstaPin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstaPin-MotoG84-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
